services:
  sri:
    build: .
    container_name: sri-app
    ports:
      - "8501:8501"
    env_file:
      - .env            # loads GROQ_API_KEY (see .env.example)
    environment:
      - PYTHONUNBUFFERED=1
      - SRI_ENV=production
    volumes:
      - ./data:/app/data        # corpus + ChromaDB (persistent)
      - ./models:/app/models    # fitted LSI artifacts (persistent)
      - ./logs:/app/logs        # logs
    restart: unless-stopped
